<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快注 QuickMark</title>
<style>
  :root { --red: #E23C2B; --ink: #1D1D1F; --muted: #6E6E73; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang TC", -apple-system, "Helvetica Neue", sans-serif;
    background: #FFFFFF; color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .mark {
    width: 88px; height: 88px; border-radius: 22px; background: var(--red);
    margin: 0 auto 28px; display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 44px; height: 44px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; }
  .sub { font-size: 15px; color: var(--muted); margin-bottom: 44px; letter-spacing: 0.3px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px; border: 1px solid #E5E5E7; border-radius: 16px;
    text-decoration: none; color: var(--ink); transition: all 0.18s ease;
    background: #FFFFFF;
  }
  a.card:hover { border-color: var(--red); transform: translateY(-1px); }
  .card-left { text-align: left; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
  .card-desc { font-size: 13px; color: var(--muted); }
  .arrow { color: var(--red); font-size: 18px; }
  footer { margin-top: 48px; font-size: 12px; color: #A1A1A6; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
      <path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/>
      <path d="M14 6l4 4"/>
    </svg>
  </div>
  <h1>快注</h1>
  <p class="sub">QuickMark — 照片寫字，存回原圖</p>

  <div class="cards">
    <a class="card" href="support.html">
      <div class="card-left">
        <div class="card-title">支援中心</div>
        <div class="card-desc">常見問題、操作說明、問題回報</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="privacy.html">
      <div class="card-left">
        <div class="card-title">隱私政策</div>
        <div class="card-desc">Privacy Policy · 中英雙語</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <footer>
    麥烝瑋 · deemgem@gmail.com<br>
    © 2026 QuickMark. All rights reserved.
  </footer>
</div>
</body>
</html>
